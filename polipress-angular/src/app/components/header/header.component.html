<!--header de la pagina (logo, eslogan, buscador, ícono de sidebar, botones y nav de categorias)-->
<header class="header">
  <section class="header__top">
    <nav class="header__left" aria-label="Acciones de header">
      <button class="header__icon-btn" id="sidebar-open-btn" aria-label="Abrir menú lateral"
        (click)="layout.openSidebar()">☰</button>
      <button class="header__icon-btn" id="search-toggle-btn" aria-label="Buscar noticias" (click)="toggleSearch()"><img
          src="/assets/icons/search.jpg" alt="Buscar" class="sidebar__nav-icon"
          style="width:22px;height:22px;"></button>
    </nav>
    <section class="header__center">
      <a routerLink="/" (click)="layout.resetSearch()" class="header__brand-link">
        <img src="/assets/icons/logo.jpg" alt="PoliPress" class="header__logo-img">
        <span class="header__logo">PoliPress</span>
        <span class="header__slogan">Conectando ideas, tendencias y actualidad.</span>
      </a>
    </section>
    <nav class="header__right" aria-label="Acciones de usuario">
      @if (user(); as u) {
      <span class="header__user-icon" id="header-user-menu">
        <span id="header-user-name">{{ u.user }}</span>
        <button class="btn btn--sm btn--outline" id="header-logout-btn" (click)="logout()">Salir</button>
      </span>
      } @else {
      <a routerLink="/login" class="btn btn--primary" id="header-login-btn">Iniciar sesión</a>
      }
    </nav>
  </section>


  <section class="search-bar" id="search-bar" [class.search-bar--active]="layout.searchOpen()">
    <section class="search-bar__input-wrapper">
      <span class="search-bar__icon"><img src="/assets/icons/search.jpg" alt="" width="18" height="18"
          style="border-radius:3px;object-fit:cover;"></span>
      <input #searchInput type="search" class="search-bar__input" id="search-input"
        placeholder="Buscar noticias por título..." aria-label="Buscar noticias por título"
        [value]="layout.searchQuery()" (input)="onSearchInput($event)" (keydown)="onSearchKeydown($event)">
    </section>
  </section>


  <nav class="category-bar" aria-label="Filtro de categorías">
    <section class="category-bar__list">
      @if (isHome()) {
      <button class="category-tab" [class.category-tab--active]="activeCategory() === 'all'" data-category="all"
        (click)="selectCategory('all')">Últimas Noticias</button>
      @for (cat of categorias; track cat) {
      <button class="category-tab" [class.category-tab--active]="activeCategory() === cat" [attr.data-category]="cat"
        (click)="selectCategory(cat)">{{ cat }}</button>
      }
      } @else {
      <a routerLink="/" class="category-tab">Últimas Noticias</a>
      @for (cat of categorias; track cat) {
      <a routerLink="/" [queryParams]="{ cat: cat }" class="category-tab">{{ cat }}</a>
      }
      }
    </section>
  </nav>
</header>
